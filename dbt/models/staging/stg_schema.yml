version: '1.0.0'

models:
  - name: stg_events
    description: "Staging events table - 1 row per event."
    columns:
      - name: event_timestamp
        description: "Event timestamp"
        tests:
          - not_null

      - name: visitor_id
        description: "Visitor ID"
        tests:
          - not_null
      - name: event_type
        description: "Event type"
        tests:
          - not_null

      - name: item_id
        description: "Item ID"
      
      - name: transaction_id
        description: "Transaction ID"

  - name: stg_category_tree
    description: "Staging category tree table - 1 row per category."
    columns:
      - name: category_id
        description: "Category ID"
        tests:
          - not_null
          - unique
      - name: parent_category_id
        description: "Parent category ID"

  - name: stg_item_properties
    description: "Staging item properties table - 1 row per item."
    columns:
      - name: snapshot_timestamp
        description: "Snapshot timestamp"
        tests:
          - not_null
      - name: item_id
        description: "Item ID"
        tests:
          - not_null
      - name: property_name
        description: "Property name"
        tests:
          - not_null
      - name: property_value
        description: "Property value"
        tests:
          - not_null