version: '1.0.0'

models:
  - name: int_events_sessionized
    description: "Intermediate events sessionized table - 1 row per session."
    columns:
      - name: session_id
        description: "Session ID"
        tests:
          - not_null

      - name: visitor_id
        description: "Visitor ID"
        tests:
          - not_null

      - name: item_id
        description: "Item ID"
        tests:
          - not_null

      - name: event_timestamp
        description: "Event Timestamp"
        tests:
          - not_null

      - name: event_type
        description: "Event Type"
        tests:
          - not_null

      - name: transaction_id
        description: "Transaction ID"

      - name: event_sequence_number
        description: "Event Sequence Number"

      - name: seconds_since_previous_event
        description: "Seconds Since Previous Event"

  - name: int_properties_latest
    description: "Intermediate item properties latest table - 1 row per item per property."
    columns:
      - name: item_id
        description: "Item ID"
        tests:
          - not_null

      - name: property_name
        description: "Property Name"
        tests:
          - not_null

      - name: property_value
        description: "Property Value"
        tests:
          - not_null

      - name: property_updated_at
        description: "Property Updated At"
        tests:
          - not_null