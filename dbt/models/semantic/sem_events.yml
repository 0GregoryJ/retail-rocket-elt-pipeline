version: 2

semantic_models:
  - name: events
    description: One row per event.
    model: ref('fct_events')

    defaults:
      agg_time_dimension: event_date

    entities:
      - name: event
        type: primary
        expr: event_id

      - name: item
        type: foreign
        expr: item_id

      - name: visitor
        type: foreign
        expr: visitor_id

    dimensions:
      - name: event_date
        type: time
        type_params:
          time_granularity: day

      - name: event_type
        type: categorical

    measures:
      - name: event_count
        description: Number of events.
        agg: count
        expr: event_id

      - name: unique_event_visitors
        description: Number of distinct visitors generating events.
        agg: count_distinct
        expr: visitor_id

      - name: unique_event_items
        description: Number of distinct items involved in events.
        agg: count_distinct
        expr: item_id

metrics:
  - name: total_events
    label: Total Events
    description: Total number of recorded events.
    type: simple
    type_params:
      measure: event_count

  - name: unique_event_visitors
    label: Unique Visitors
    description: Number of distinct visitors generating events.
    type: simple
    type_params:
      measure: unique_event_visitors

  - name: unique_event_items
    label: Unique Items
    description: Number of distinct items involved in events.
    type: simple
    type_params:
      measure: unique_event_items